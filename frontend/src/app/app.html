<div class="page-shell">
  <header class="site-header">
    <a class="brand" routerLink="/" aria-label="Parkeo, inicio">
      <span class="brand-mark" aria-hidden="true">P</span><span>Autos Colombia</span>
    </a>
    <div class="session" aria-live="polite">
      @if (usuario(); as activo) {
        <span class="session-name">
          <strong>{{ activo.nombre }}</strong>
          <small>{{ activo.rol === 'ADMINISTRADOR' ? 'Administrador' : 'Operador' }}</small>
        </span>
        <button type="button" (click)="cerrarSesion()">Cerrar sesión</button>
      } @else {
        <a routerLink="/login" routerLinkActive="active">Iniciar sesión</a>
      }
    </div>
    <nav aria-label="Navegación principal">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        >Inicio</a
      >
      <a routerLink="/tablero" routerLinkActive="active" ariaCurrentWhenActive="page"
        >Tablero</a
      >
      <a routerLink="/control-acceso" routerLinkActive="active" ariaCurrentWhenActive="page"
        >Registrar entrada</a
      >
      <a routerLink="/salida" routerLinkActive="active" ariaCurrentWhenActive="page"
        >Registrar salida</a
      >
      <a routerLink="/cambiar-celda" routerLinkActive="active" ariaCurrentWhenActive="page"
        >Cambiar celda</a
      >
      <a routerLink="/gestion/celdas" routerLinkActive="active" ariaCurrentWhenActive="page"
        >Celdas</a
      >
      <a routerLink="/gestion/vehiculos" routerLinkActive="active" ariaCurrentWhenActive="page"
        >Vehículos</a
      >
    </nav>
  </header>
  <main><router-outlet /></main>
  <footer><span>Parkeo</span><span>Control vehicular con claridad.</span></footer>
</div>
